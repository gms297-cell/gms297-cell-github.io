<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
        }

        .headshot {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
        }

        h1 {
            margin-top: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="container">
        <img src="headshot.png" alt="My headshot" class="headshot">

        <h1>Hi, I'm Gianna!</h1>

        <p>
            Welcome to my website. I'm an Accounting and Information Systems
            student interested in business, tax, and professional development.
        </p>
    </div>

</body>
</html>
